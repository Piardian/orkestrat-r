  - id: gemini-3.5-flash-lite-google-demo
    provider: gemini
    model: gemini/gemini-3.5-flash-lite
    base_url:
    secret_env: GEMINI_USER_A_KEY
    owner: demo
    enabled: true
    role: demo

  - id: codex-main
    provider: openai-codex
    model: codex
    base_url:
    secret_env: OPENAI_API_KEY
    owner: codex
    enabled: false
    role: patcher

  - id: local-main
    provider: ollama
    model: llama3.1
    base_url: http://localhost:11434
    secret_env:
    owner: local
    enabled: false
    role: worker
