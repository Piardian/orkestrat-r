profiles:
  - id: gemini-user-a
    provider: gemini
    model: gemini/gemini-3.1-flash-lite
    base_url:
    secret_env: GEMINI_USER_A_KEY
    owner: user-a
    enabled: true
    role: analyst-adversarial

  - id: gemini-user-b
    provider: gemini
    model: gemini/gemini-3.1-flash-lite
    base_url:
    secret_env: GEMINI_USER_B_KEY
    owner: user-b
    enabled: true
    role: analyst-evidence-first

  - id: gemini-user-c
    provider: gemini
    model: gemini/gemini-3.1-flash-lite
    base_url:
    secret_env: GEMINI_USER_C_KEY
    owner: user-c
    enabled: true
    role: analyst

  - id: gemini-user-d
    provider: gemini
    model: gemini/gemini-3.1-flash-lite
    base_url:
    secret_env: GEMINI_USER_D_KEY
    owner: user-d
    enabled: true
    role: reviewer

  - id: gemini-commander-main
    provider: gemini
    model: gemini/gemini-3.1-flash-lite
    base_url:
    secret_env: GEMINI_USER_A_KEY
    owner: commander
    enabled: true
    role: commander

  - id: nemotron-main
    provider: openai-compatible
    model: nvidia/nemotron-3-super-120b-a12b
