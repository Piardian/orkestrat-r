name: Refresh uv lock

on:
  pull_request:
    paths:
      - 'agent-core/pyproject.toml'
      - 'agent-core/uv.lock'
      - '.github/workflows/uv-lock-bootstrap.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate exact uv lock
        working-directory: agent-core
        run: |
          python -m pip install uv
          uv lock
      - name: Commit lock only when changed
        run: |
          if git diff --quiet -- agent-core/uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-core/uv.lock
          git commit -m "Refresh uv.lock"
          git push origin HEAD:${{ github.head_ref }}
