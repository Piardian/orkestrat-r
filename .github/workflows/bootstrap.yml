name: Bootstrap project

on:
  push:
    paths:
      - bootstrap.ready

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap.xz.b64.part* > bootstrap.xz.b64
          base64 --decode bootstrap.xz.b64 > bootstrap.tar.xz
          rm -rf .bootstrap
          mkdir .bootstrap
          tar -xJf bootstrap.tar.xz -C .bootstrap
          shopt -s dotglob nullglob
          cp -a .bootstrap/ajan-ordusu/. .
          rm -rf .bootstrap bootstrap.tar.xz bootstrap.xz.b64 bootstrap.xz.b64.part* bootstrap.ready
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import agent army project"
          git push
