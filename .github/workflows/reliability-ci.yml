name: Reliability CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reliability-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent-core
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: agent-core/requirements-reliability.txt
      - name: Install reliability stack
        run: python -m pip install -r requirements-reliability.txt
      - name: Compile source
        run: python -m compileall -q .
      - name: Reliability and production-safety smoke tests
        run: python -m unittest test_reliability_stack.py test_production_safety_stack.py test_transactional_apply.py -v

  full-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-core
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent-core/requirements-reliability.txt
      - name: Install reliability stack
        run: python -m pip install -r requirements-reliability.txt
      - name: Full test suite
        env:
          AGENT_ARMY_STATE_BACKEND: file
          AGENT_ARMY_VERIFICATION_SANDBOX: host
          AGENT_ARMY_OPENHANDS_WORKSPACE: local
          AGENT_ARMY_TEMPORAL_REQUIRE_POSTGRES: 'false'
        run: python -m unittest discover -v

  postgres-safety:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent_army
          POSTGRES_PASSWORD: agent_army
          POSTGRES_DB: agent_army
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agent_army -d agent_army"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: agent-core
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent-core/requirements-reliability.txt
      - name: Install reliability stack
        run: python -m pip install -r requirements-reliability.txt
      - name: PostgreSQL concurrency and idempotency tests
        env:
          AGENT_ARMY_DATABASE_URL: postgresql://agent_army:agent_army@127.0.0.1:5432/agent_army
          AGENT_ARMY_STATE_BACKEND: postgres
          AGENT_ARMY_TEMPORAL_REQUIRE_POSTGRES: 'true'
        run: python -m unittest test_postgres_safety.py -v

  dependency-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-core
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Verify uv lock exists and is current
        run: uv lock --check

  crewai-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-core
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent-core/requirements-crewai.txt
      - name: Install CrewAI environment
        run: python -m pip install -r requirements-crewai.txt
      - name: Verify CrewAI flow imports separately
        run: python -c "import crewai; from orchestration.crewai_flow import run_crewai_flow; print('CrewAI contract OK')"

  openhands-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-core
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agent-core/requirements-openhands.txt
      - name: Install isolated OpenHands environment
        run: python -m pip install -r requirements-openhands.txt
      - name: Verify DockerWorkspace package contract
        run: python -c "from openhands.workspace import DockerWorkspace; from goal.openhands_docker_adapter import DockerOpenHandsBuilderAdapter; print('OpenHands Docker contract OK')"
      - name: Exercise networkless Docker verification
        run: |
          mkdir -p /tmp/agent-army-sandbox-smoke
          printf 'print("sandbox-ok")\n' > /tmp/agent-army-sandbox-smoke/test.py
          AGENT_ARMY_VERIFICATION_IMAGE=python:3.12-alpine python - <<'PY'
          from goal.verification_sandbox import run_docker_verification_suite
          result = run_docker_verification_suite(["python test.py"], "/tmp/agent-army-sandbox-smoke", timeout=120)
          print(result)
          assert result["status"] == "PASS", result
          assert result["sandbox"] == "docker-network-none-copy"
          PY
